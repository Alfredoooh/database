<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNG → SVG em lote (sem servidor)</title>
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #17171b;
    --border: #2a2a30;
    --accent: #7c5cff;
    --text: #eaeaf0;
    --text-dim: #9a9aa5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.subtitle { color: var(--text-dim); font-size: 14px; margin: 0 0 24px; text-align: center; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 720px;
  }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone.dragover { border-color: var(--accent); background: rgba(124, 92, 255, 0.08); }
  .dropzone p { margin: 8px 0 0; color: var(--text-dim); font-size: 14px; }
  .dropzone input { display: none; }
  .icon { width: 32px; height: 32px; margin: 0 auto; display: block; color: var(--text-dim); }

  /* ZIP badge */
  .zip-badge {
    display: inline-block;
    background: rgba(124, 92, 255, 0.18);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.04em;
  }

  .mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }
  .mode-tab {
    background: #0d0d0f;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .mode-tab.active {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(124, 92, 255, 0.12);
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .options.hidden { display: none; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-dim); }
  .field select, .field input[type=number] {
    background: #0d0d0f;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 14px;
  }

  .simplify-box {
    margin-top: 16px;
    background: #0d0d0f;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .simplify-box .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .simplify-box .row span:first-child { font-size: 13px; font-weight: 600; }
  .simplify-box .row span:last-child { font-size: 12px; color: var(--accent); font-weight: 600; }
  .simplify-box input[type=range] {
    width: 100%;
    accent-color: var(--accent);
  }
  .simplify-box .hint { font-size: 11px; color: var(--text-dim); margin-top: 6px; }

  .batch-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    margin-top: 20px;
    max-height: 480px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .batch-grid.show { display: grid; }
  .batch-item {
    background: #0d0d0f;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
  }
  .batch-item.done { border-color: #3ddc84; }
  .batch-item.error { border-color: #ff6b6b; }
  .batch-item .thumb-wrap {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    overflow: hidden;
    background:
      linear-gradient(45deg, #1f1f24 25%, transparent 25%),
      linear-gradient(-45deg, #1f1f24 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1f1f24 75%),
      linear-gradient(-45deg, transparent 75%, #1f1f24 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
    background-color: #17171b;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .batch-item img { width: 100%; height: 100%; object-fit: contain; }
  .batch-item input[type=text] {
    background: #17171b;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 12px;
    width: 100%;
  }
  .batch-item .file-size {
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
  }
  .batch-item .status-dot {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    z-index: 2;
  }
  .batch-item.done .status-dot { background: #3ddc84; }
  .batch-item.error .status-dot { background: #ff6b6b; }
  .batch-item.converting .status-dot { background: var(--accent); animation: pulse 0.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .batch-item .remove-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(13, 13, 15, 0.85);
    border: 1px solid var(--border);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    padding: 0;
    line-height: 1;
    font-size: 13px;
  }
  .batch-item .remove-btn:active { background: #ff6b6b; color: white; border-color: #ff6b6b; }

  .batch-summary {
    display: none;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .batch-summary.show { display: flex; }

  .add-more-btn {
    display: none;
    width: 100%;
    margin-top: 12px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .add-more-btn.show { display: block; }
  .add-more-btn:active { border-color: var(--accent); color: var(--text); }

  button.primary {
    width: 100%;
    margin-top: 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .progress-wrap {
    display: none;
    margin-top: 14px;
  }
  .progress-wrap.show { display: block; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .progress-track {
    width: 100%;
    height: 8px;
    background: #0d0d0f;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.2s ease;
  }

  .status {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    min-height: 18px;
  }
  .status.error { color: #ff6b6b; }

  .preview {
    margin-top: 20px;
    background: #ffffff;
    border-radius: 12px;
    padding: 16px;
    display: none;
    align-items: center;
    justify-content: center;
    min-height: 160px;
  }
  .preview.show { display: flex; }
  .preview.transparent-bg {
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #ccc 25%, transparent 25%),
      linear-gradient(-45deg, #ccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ccc 75%),
      linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  }
  .preview svg, .preview img { max-width: 100%; max-height: 240px; }

  .actions { margin-top: 12px; display: none; flex-wrap: wrap; gap: 8px; }
  .actions.show { display: flex; }
  .actions button {
    flex: 1;
    min-width: 100px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .actions button:active { background: rgba(255,255,255,0.05); }
  .actions button.copied { border-color: #3ddc84; color: #3ddc84; }
  .actions button.secondary { border-style: dashed; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>PNG → SVG</h1>
<p class="subtitle">Conversão 100% no navegador — imagens soltas ou ZIP, sem servidor</p>

<div class="card">

  <div class="dropzone" id="dropzone">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p id="dropzoneText">Toque para escolher imagens ou um <span class="zip-badge">ZIP</span><br>PNG/JPG soltos ou .zip com imagens dentro</p>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,application/zip,.zip" multiple>
  </div>

  <button type="button" class="add-more-btn" id="addMoreBtn">+ Adicionar mais imagens ou ZIP</button>
  <input type="file" id="fileInputAdd" accept="image/png,image/jpeg,application/zip,.zip" multiple style="display:none">

  <div class="mode-tabs">
    <button type="button" class="mode-tab active" id="tabColorido">Colorido</button>
    <button type="button" class="mode-tab" id="tabPreto">Preto puro</button>
  </div>

  <div class="options" id="optionsColorido">
    <div class="field">
      <label for="cores">Cores</label>
      <input type="number" id="cores" value="8" min="2" max="32">
    </div>
    <div class="field">
      <label for="scale">Escala</label>
      <input type="number" id="scale" value="1" min="1" max="4" step="1">
    </div>
  </div>

  <div class="options hidden" id="optionsPreto">
    <div class="field">
      <label for="scalePreto">Escala</label>
      <input type="number" id="scalePreto" value="1" min="1" max="4" step="1">
    </div>
    <div class="field">
      <label for="limiarAlpha">Limiar (0-255)</label>
      <input type="number" id="limiarAlpha" value="128" min="1" max="254" step="1">
    </div>
  </div>

  <div class="simplify-box">
    <div class="row">
      <span>Simplicidade da curva</span>
      <span id="simplifyLabel">Equilibrado</span>
    </div>
    <input type="range" id="simplifySlider" min="0" max="4" step="1" value="2">
    <div class="hint" id="simplifyHint">Menos pontos = arquivo mais leve, mais pontos = mais fiel ao original.</div>
  </div>

  <div class="batch-grid" id="batchGrid"></div>
  <div class="batch-summary" id="batchSummary">
    <span id="batchCount">0 imagens</span>
    <span id="batchTotalSize"></span>
  </div>

  <button class="primary" id="convertBtn" disabled>Converter</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label">
      <span id="progressText">Convertendo...</span>
      <span id="progressCount">0 / 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="preview" id="preview"></div>
  <div class="actions" id="actions">
    <button id="copyBtn">Copiar SVG</button>
    <button id="downloadBtn">Baixar SVG</button>
    <button id="resetBtn">Nova imagem</button>
  </div>

  <div class="actions" id="batchActions">
    <button id="downloadZipBtn">Baixar tudo em .zip</button>
    <button id="downloadAllOneByOneBtn" class="secondary">Baixar um por um</button>
    <button id="batchResetBtn">Nova conversão</button>
  </div>

</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  if (typeof ImageTracer === "undefined") mostrarErroFatal("Erro: biblioteca de rastreamento não carregou (verifique a conexão)");
  if (typeof JSZip === "undefined") mostrarErroFatal("Erro: biblioteca de zip não carregou (verifique a conexão)");
});

function mostrarErroFatal(msg) {
  document.getElementById("status").textContent = msg;
  document.getElementById("status").classList.add("error");
  document.getElementById("convertBtn").disabled = true;
}

// ── DOM refs ──────────────────────────────────────────────────
const dropzone              = document.getElementById("dropzone");
const dropzoneText          = document.getElementById("dropzoneText");
const fileInput             = document.getElementById("fileInput");
const addMoreBtn            = document.getElementById("addMoreBtn");
const fileInputAdd          = document.getElementById("fileInputAdd");
const convertBtn            = document.getElementById("convertBtn");
const statusEl              = document.getElementById("status");
const preview               = document.getElementById("preview");
const actions               = document.getElementById("actions");
const copyBtn               = document.getElementById("copyBtn");
const downloadBtn           = document.getElementById("downloadBtn");
const resetBtn              = document.getElementById("resetBtn");
const tabColorido           = document.getElementById("tabColorido");
const tabPreto              = document.getElementById("tabPreto");
const optionsColorido       = document.getElementById("optionsColorido");
const optionsPreto          = document.getElementById("optionsPreto");
const simplifySlider        = document.getElementById("simplifySlider");
const simplifyLabel         = document.getElementById("simplifyLabel");
const simplifyHint          = document.getElementById("simplifyHint");
const batchGrid             = document.getElementById("batchGrid");
const batchSummary          = document.getElementById("batchSummary");
const batchCount            = document.getElementById("batchCount");
const batchTotalSize        = document.getElementById("batchTotalSize");
const batchActions          = document.getElementById("batchActions");
const downloadZipBtn        = document.getElementById("downloadZipBtn");
const downloadAllOneByOneBtn= document.getElementById("downloadAllOneByOneBtn");
const batchResetBtn         = document.getElementById("batchResetBtn");
const progressWrap          = document.getElementById("progressWrap");
const progressFill          = document.getElementById("progressFill");
const progressText          = document.getElementById("progressText");
const progressCount         = document.getElementById("progressCount");

// ── Estado ────────────────────────────────────────────────────
let modoAtual = "colorido";
let arquivoSelecionado = null;
let svgAtual = null;
let lote = [];
let idCounter = 0;

// ── Presets ───────────────────────────────────────────────────
const PRESETS = [
  { nome: "Máxima economia",    ltres: 4,   qtres: 4,   pathomit: 20, decimais: 0 },
  { nome: "Leve",               ltres: 2,   qtres: 2,   pathomit: 12, decimais: 1 },
  { nome: "Equilibrado",        ltres: 1,   qtres: 1,   pathomit: 8,  decimais: 1 },
  { nome: "Fiel",               ltres: 0.5, qtres: 0.5, pathomit: 4,  decimais: 2 },
  { nome: "Máxima fidelidade",  ltres: 0.2, qtres: 0.2, pathomit: 1,  decimais: 2 }
];

function presetAtual() { return PRESETS[parseInt(simplifySlider.value, 10)]; }

function atualizarLabelSimplificacao() {
  const p = presetAtual();
  simplifyLabel.textContent = p.nome;
  const v = parseInt(simplifySlider.value, 10);
  if (v === 0) simplifyHint.textContent = "Arquivo o mais leve possível — pode perder curvas finas.";
  else if (v >= 3) simplifyHint.textContent = "Mais fiel ao desenho original — arquivo maior.";
  else simplifyHint.textContent = "Menos pontos = arquivo mais leve, mais pontos = mais fiel ao original.";
}
simplifySlider.addEventListener("input", atualizarLabelSimplificacao);
atualizarLabelSimplificacao();

// ── Tabs modo cor ─────────────────────────────────────────────
tabColorido.addEventListener("click", () => {
  modoAtual = "colorido";
  tabColorido.classList.add("active"); tabPreto.classList.remove("active");
  optionsColorido.classList.remove("hidden"); optionsPreto.classList.add("hidden");
});
tabPreto.addEventListener("click", () => {
  modoAtual = "preto";
  tabPreto.classList.add("active"); tabColorido.classList.remove("active");
  optionsPreto.classList.remove("hidden"); optionsColorido.classList.add("hidden");
});

// ── Dropzone ──────────────────────────────────────────────────
dropzone.addEventListener("click", () => fileInput.click());

["dragover","dragenter"].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.add("dragover"); }));
["dragleave","drop"].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.remove("dragover"); }));

dropzone.addEventListener("drop", async (e) => {
  const files = Array.from(e.dataTransfer.files);
  if (files.length) await processarSelecaoInicial(files);
});

fileInput.addEventListener("change", async (e) => {
  const files = Array.from(e.target.files);
  if (files.length) await processarSelecaoInicial(files);
  fileInput.value = "";
});

// ── Extrai imagens de um ZIP, retorna array de File ───────────
async function extrairImagensDoZip(zipFile) {
  const zip = await JSZip.loadAsync(zipFile);
  const imagens = [];
  const EXTS_IMAGEM = /\.(png|jpg|jpeg)$/i;
  // JSZip usa forEach mas precisamos de async — coletamos promises
  const promises = [];
  zip.forEach((caminho, entry) => {
    if (entry.dir) return;
    // ignora arquivos do sistema macOS (__MACOSX, .DS_Store etc.)
    if (caminho.startsWith("__MACOSX/") || caminho.includes("/.") || /\/\._/.test(caminho)) return;
    const nome = caminho.split("/").pop();
    if (!EXTS_IMAGEM.test(nome)) return;
    promises.push(
      entry.async("blob").then(blob => {
        const tipo = nome.toLowerCase().endsWith(".png") ? "image/png" : "image/jpeg";
        return new File([blob], nome, { type: tipo });
      })
    );
  });
  const resultados = await Promise.all(promises);
  return resultados;
}

// ── Separa ficheiros normais de ZIPs numa lista mista ─────────
async function resolverFicheiros(files) {
  const imagensNormais = [];
  const zipFiles = [];

  for (const f of files) {
    if (f.type === "application/zip" || f.name.toLowerCase().endsWith(".zip")) {
      zipFiles.push(f);
    } else if (f.type.startsWith("image/")) {
      imagensNormais.push(f);
    }
  }

  // Extrai todos os zips em paralelo
  const extraidasPorZip = await Promise.all(zipFiles.map(extrairImagensDoZip));
  const imagensDeZip = extraidasPorZip.flat();

  return [...imagensNormais, ...imagensDeZip];
}

async function processarSelecaoInicial(files) {
  // mostra loading enquanto extrai zip
  const temZip = files.some(f => f.type === "application/zip" || f.name.toLowerCase().endsWith(".zip"));
  if (temZip) {
    statusEl.classList.remove("error");
    statusEl.innerHTML = `<span class="spinner"></span>Extraindo ZIP...`;
  }

  const todasImagens = await resolverFicheiros(files);

  statusEl.textContent = "";

  if (todasImagens.length === 0) {
    statusEl.textContent = "Nenhuma imagem PNG/JPG encontrada.";
    statusEl.classList.add("error");
    return;
  }

  if (lote.length > 0) {
    adicionarAoLote(todasImagens);
    return;
  }

  limparTudo();

  if (todasImagens.length === 1) {
    selecionarArquivoUnico(todasImagens[0]);
  } else {
    montarLote(todasImagens);
  }
}

function limparTudo() {
  arquivoSelecionado = null;
  svgAtual = null;
  lote = [];
  idCounter = 0;
  batchGrid.innerHTML = "";
  batchGrid.classList.remove("show");
  batchSummary.classList.remove("show");
  batchActions.classList.remove("show");
  addMoreBtn.classList.remove("show");
  preview.classList.remove("show", "transparent-bg");
  preview.innerHTML = "";
  actions.classList.remove("show");
  statusEl.textContent = "";
  statusEl.classList.remove("error");
  progressWrap.classList.remove("show");
  progressFill.style.width = "0%";
  dropzoneText.innerHTML = `Toque para escolher imagens ou um <span class="zip-badge">ZIP</span><br>PNG/JPG soltos ou .zip com imagens dentro`;
  convertBtn.textContent = "Converter";
  convertBtn.disabled = true;
}

// ── Single file ───────────────────────────────────────────────
function selecionarArquivoUnico(file) {
  arquivoSelecionado = file;
  dropzoneText.innerHTML = `<strong>${escapeHtml(file.name)}</strong><br>${(file.size / 1024).toFixed(0)} KB`;
  convertBtn.disabled = false;
}

function carregarImagem(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function paraPretoPuro(imageData, limiarAlpha) {
  const d = imageData.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] >= limiarAlpha) { d[i] = 0; d[i+1] = 0; d[i+2] = 0; d[i+3] = 255; }
    else { d[i] = 0; d[i+1] = 0; d[i+2] = 0; d[i+3] = 0; }
  }
  return imageData;
}

function forcarPretoPuroNoSvg(svg) {
  return svg
    .replace(/fill="rgb\([^)]*\)"/g, 'fill="#000000"')
    .replace(/<path[^>]*fill-opacity="0"[^>]*\/>/g, '');
}

function arredondarCoordenadasSvg(svg, casas) {
  return svg.replace(/-?\d+\.\d+/g, n => parseFloat(parseFloat(n).toFixed(casas)).toString());
}

function removerMetadata(svg) {
  return svg.replace(/<desc>.*?<\/desc>/gs, "");
}

function gerarOpcoesTracer(preset) {
  return { ltres: preset.ltres, qtres: preset.qtres, pathomit: preset.pathomit, strokewidth: 0, scale: 1, viewbox: true, desc: false };
}

function converterImagemParaSvg(img, preset) {
  if (modoAtual === "colorido") {
    const escala = parseInt(document.getElementById("scale").value, 10) || 1;
    const canvas = document.createElement("canvas");
    canvas.width = img.width * escala;
    canvas.height = img.height * escala;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = escala > 1;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const opcoes = Object.assign(gerarOpcoesTracer(preset), {
      numberofcolors: parseInt(document.getElementById("cores").value, 10) || 8,
      colorsampling: 2,
      mincolorratio: 0
    });
    let svg = ImageTracer.imagedataToSVG(imageData, opcoes);
    svg = removerMetadata(svg);
    svg = arredondarCoordenadasSvg(svg, preset.decimais);
    return svg;
  } else {
    const escala = parseInt(document.getElementById("scalePreto").value, 10) || 1;
    const canvas = document.createElement("canvas");
    canvas.width = img.width * escala;
    canvas.height = img.height * escala;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    imageData = paraPretoPuro(imageData, parseInt(document.getElementById("limiarAlpha").value, 10) || 128);
    const opcoes = Object.assign(gerarOpcoesTracer(preset), {
      numberofcolors: 2, colorquantcycles: 1, colorsampling: 0, mincolorratio: 0,
      pal: [{ r:0,g:0,b:0,a:255 },{ r:0,g:0,b:0,a:0 }]
    });
    let svg = ImageTracer.imagedataToSVG(imageData, opcoes);
    svg = forcarPretoPuroNoSvg(svg);
    svg = removerMetadata(svg);
    svg = arredondarCoordenadasSvg(svg, preset.decimais);
    return svg;
  }
}

async function converterUnico() {
  if (!arquivoSelecionado) return;
  convertBtn.disabled = true;
  statusEl.classList.remove("error");
  statusEl.innerHTML = `<span class="spinner"></span>Convertendo...`;
  preview.classList.remove("show", "transparent-bg");
  actions.classList.remove("show");
  try {
    const img = await carregarImagem(arquivoSelecionado);
    svgAtual = converterImagemParaSvg(img, presetAtual());
    preview.innerHTML = svgAtual;
    preview.classList.add("show");
    if (modoAtual === "preto") preview.classList.add("transparent-bg");
    actions.classList.add("show");
    statusEl.textContent = `Pronto — ${(new Blob([svgAtual]).size / 1024).toFixed(1)} KB`;
  } catch (err) {
    statusEl.textContent = "Erro: " + err.message;
    statusEl.classList.add("error");
  } finally {
    convertBtn.disabled = false;
  }
}

copyBtn.addEventListener("click", async () => {
  if (!svgAtual) return;
  const orig = copyBtn.textContent;
  try { await navigator.clipboard.writeText(svgAtual); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = svgAtual; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = "Copiado!"; copyBtn.classList.add("copied");
  setTimeout(() => { copyBtn.textContent = orig; copyBtn.classList.remove("copied"); }, 1500);
});

downloadBtn.addEventListener("click", () => {
  if (!svgAtual) return;
  baixarSvgIndividual(svgAtual, (arquivoSelecionado?.name.replace(/\.[^/.]+$/, "") || "imagem") + ".svg");
});

resetBtn.addEventListener("click", limparTudo);

// ── Lote ──────────────────────────────────────────────────────
function escapeHtml(str) {
  const d = document.createElement("div"); d.textContent = str; return d.innerHTML;
}

function nomeSugerido(filename) { return filename.replace(/\.[^/.]+$/, ""); }

function criarItemLote(file) {
  const item = { id: idCounter++, file, img: null, svg: null, tamanhoBytes: 0, status: "pendente" };

  const el = document.createElement("div");
  el.className = "batch-item";
  el.dataset.id = item.id;

  const thumbWrap = document.createElement("div");
  thumbWrap.className = "thumb-wrap";
  const imgEl = document.createElement("img");
  imgEl.src = URL.createObjectURL(file);
  imgEl.alt = file.name;
  thumbWrap.appendChild(imgEl);

  const statusDot = document.createElement("div");
  statusDot.className = "status-dot";

  const removeBtn = document.createElement("button");
  removeBtn.type = "button"; removeBtn.className = "remove-btn";
  removeBtn.setAttribute("aria-label", "Remover imagem");
  removeBtn.textContent = "×";
  removeBtn.addEventListener("click", (e) => { e.stopPropagation(); removerItemLote(item.id); });

  const nomeInput = document.createElement("input");
  nomeInput.type = "text";
  nomeInput.value = nomeSugerido(file.name);
  nomeInput.placeholder = "nome-do-icone";
  nomeInput.addEventListener("input", () => { nomeInput.value = nomeInput.value.replace(/[\/\\:*?"<>|]/g, ""); });

  const sizeLabel = document.createElement("div");
  sizeLabel.className = "file-size";
  sizeLabel.textContent = (file.size / 1024).toFixed(0) + " KB original";

  el.appendChild(thumbWrap); el.appendChild(statusDot);
  el.appendChild(removeBtn); el.appendChild(nomeInput); el.appendChild(sizeLabel);

  item.elItem = el; item.elStatusDot = statusDot;
  item.elNomeInput = nomeInput; item.elSizeLabel = sizeLabel;
  return item;
}

function montarLote(files) {
  lote = []; idCounter = 0; batchGrid.innerHTML = "";
  files.forEach(file => { const item = criarItemLote(file); lote.push(item); batchGrid.appendChild(item.elItem); });
  finalizarMudancaDeLote(`<strong>${lote.length} imagens selecionadas</strong><br>edite o nome de cada uma abaixo`);
}

function adicionarAoLote(files) {
  files.forEach(file => { const item = criarItemLote(file); lote.push(item); batchGrid.appendChild(item.elItem); });
  finalizarMudancaDeLote(`<strong>${lote.length} imagens no total</strong><br>edite o nome de cada uma abaixo`);
  if (lote.some(i => i.status === "pronto")) convertBtn.textContent = "Converter novas imagens";
}

function removerItemLote(id) {
  const idx = lote.findIndex(i => i.id === id);
  if (idx === -1) return;
  lote[idx].elItem.remove();
  lote.splice(idx, 1);
  if (lote.length === 0) { limparTudo(); return; }
  atualizarResumoLote();
  if (!lote.some(i => i.status === "pronto")) batchActions.classList.remove("show");
  if (!lote.some(i => i.status === "pendente" || i.status === "erro")) convertBtn.textContent = "Converter";
}

function finalizarMudancaDeLote(html) {
  dropzoneText.innerHTML = html;
  convertBtn.disabled = false;
  batchGrid.classList.add("show");
  batchSummary.classList.add("show");
  addMoreBtn.classList.add("show");
  atualizarResumoLote();
}

function atualizarResumoLote() {
  batchCount.textContent = `${lote.length} imagens`;
  const prontos = lote.filter(i => i.status === "pronto");
  if (prontos.length > 0) {
    const total = prontos.reduce((acc, i) => acc + i.tamanhoBytes, 0);
    batchTotalSize.textContent = `${prontos.length} convertidas — ${(total / 1024).toFixed(0)} KB total`;
  } else {
    batchTotalSize.textContent = "";
  }
}

function marcarStatusItem(item, status) {
  item.status = status;
  item.elItem.classList.remove("done", "error", "converting");
  if (status === "convertendo") item.elItem.classList.add("converting");
  if (status === "pronto")      item.elItem.classList.add("done");
  if (status === "erro")        item.elItem.classList.add("error");
}

async function converterLote() {
  const pendentes = lote.filter(i => i.status === "pendente" || i.status === "erro");
  if (pendentes.length === 0) return;

  convertBtn.disabled = true;
  batchActions.classList.remove("show");
  statusEl.classList.remove("error");
  statusEl.textContent = "";

  progressWrap.classList.add("show");
  progressText.textContent = "Convertendo imagens...";
  progressFill.style.width = "0%";
  progressCount.textContent = `0 / ${pendentes.length}`;

  const preset = presetAtual();
  let concluidos = 0, comErro = 0;

  for (const item of pendentes) {
    marcarStatusItem(item, "convertendo");
    try {
      const img = await carregarImagem(item.file);
      item.img = img;
      const svg = converterImagemParaSvg(img, preset);
      item.svg = svg;
      item.tamanhoBytes = new Blob([svg]).size;
      item.elSizeLabel.textContent = `${(item.tamanhoBytes / 1024).toFixed(1)} KB svg`;
      marcarStatusItem(item, "pronto");
    } catch (err) {
      marcarStatusItem(item, "erro");
      item.elSizeLabel.textContent = "falhou";
      comErro++;
    }
    concluidos++;
    progressFill.style.width = Math.round((concluidos / pendentes.length) * 100) + "%";
    progressCount.textContent = `${concluidos} / ${pendentes.length}`;
    atualizarResumoLote();
    await new Promise(r => setTimeout(r, 0));
  }

  progressText.textContent = "Conversão concluída";
  convertBtn.disabled = false;
  convertBtn.textContent = "Converter";

  if (comErro > 0) {
    statusEl.textContent = `${pendentes.length - comErro} convertidas, ${comErro} falharam`;
    statusEl.classList.add("error");
  } else {
    statusEl.textContent = `${pendentes.length} imagens convertidas com sucesso`;
  }
  batchActions.classList.add("show");
}

function nomesFinaisUnicos() {
  const usados = new Map();
  return lote.filter(i => i.status === "pronto").map(item => {
    let base = item.elNomeInput.value.trim() || `icone-${item.id + 1}`;
    const count = usados.get(base) || 0;
    usados.set(base, count + 1);
    return { item, nomeFinal: (count === 0 ? base : `${base}-${count + 1}`) + ".svg" };
  });
}

downloadZipBtn.addEventListener("click", async () => {
  const prontos = nomesFinaisUnicos();
  if (prontos.length === 0) return;
  downloadZipBtn.disabled = true;
  const orig = downloadZipBtn.textContent;
  downloadZipBtn.innerHTML = `<span class="spinner"></span>Gerando zip...`;
  try {
    const zip = new JSZip();
    prontos.forEach(({ item, nomeFinal }) => zip.file(nomeFinal, item.svg));
    const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "icones-svg.zip";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    downloadZipBtn.textContent = "Zip baixado!"; downloadZipBtn.classList.add("copied");
    setTimeout(() => { downloadZipBtn.textContent = orig; downloadZipBtn.classList.remove("copied"); downloadZipBtn.disabled = false; }, 1800);
  } catch (err) {
    downloadZipBtn.textContent = orig; downloadZipBtn.disabled = false;
    statusEl.textContent = "Zip falhou (" + err.message + ") — use 'Baixar um por um'";
    statusEl.classList.add("error");
  }
});

function baixarSvgIndividual(svgTexto, nomeArquivo) {
  const blob = new Blob([svgTexto], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

downloadAllOneByOneBtn.addEventListener("click", async () => {
  const prontos = nomesFinaisUnicos();
  if (prontos.length === 0) return;
  downloadAllOneByOneBtn.disabled = true;
  const orig = downloadAllOneByOneBtn.textContent;
  for (let i = 0; i < prontos.length; i++) {
    downloadAllOneByOneBtn.textContent = `Baixando ${i + 1}/${prontos.length}...`;
    baixarSvgIndividual(prontos[i].item.svg, prontos[i].nomeFinal);
    await new Promise(r => setTimeout(r, 350));
  }
  downloadAllOneByOneBtn.textContent = orig;
  downloadAllOneByOneBtn.disabled = false;
});

batchResetBtn.addEventListener("click", limparTudo);

// ── Adicionar mais ────────────────────────────────────────────
addMoreBtn.addEventListener("click", () => fileInputAdd.click());
fileInputAdd.addEventListener("change", async (e) => {
  const files = Array.from(e.target.files);
  if (files.length) {
    const temZip = files.some(f => f.type === "application/zip" || f.name.toLowerCase().endsWith(".zip"));
    if (temZip) { statusEl.classList.remove("error"); statusEl.innerHTML = `<span class="spinner"></span>Extraindo ZIP...`; }
    const imagens = await resolverFicheiros(files);
    statusEl.textContent = "";
    if (imagens.length) adicionarAoLote(imagens);
  }
  fileInputAdd.value = "";
});

// ── Converter ─────────────────────────────────────────────────
convertBtn.addEventListener("click", () => {
  if (typeof ImageTracer === "undefined") {
    statusEl.textContent = "Erro: biblioteca de conversão não carregou";
    statusEl.classList.add("error");
    return;
  }
  if (lote.length > 0) converterLote();
  else converterUnico();
});
</script>
