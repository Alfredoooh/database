<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Runner</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f3f2f0;
    --border: #dddad4;
    --text: #1a1a18;
    --text-dim: #6b6862;
    --accent: #2b5fd9;
    --accent-text: #ffffff;
    --ok: #1e7f4f;
    --fail: #b3261e;
    --warn: #9a6a00;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15140f;
      --surface: #201f19;
      --border: #38362c;
      --text: #ece8de;
      --text-dim: #9b968a;
      --accent: #6d93ff;
      --accent-text: #0e1320;
      --ok: #5fcf96;
      --fail: #ff8a80;
      --warn: #e0b24a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin: 0 0 28px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }

  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }

  input[type="password"], input[type="text"], select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    appearance: none;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--fail); color: #fff; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .btn-row.spread { justify-content: space-between; margin-top: 0; }

  .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .error-box {
    border: 1px solid var(--fail);
    color: var(--fail);
    background: color-mix(in srgb, var(--fail) 10%, transparent);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-top: 12px;
  }

  .repo-list, .branch-list, .history-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .repo-item, .branch-item, .history-item {
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .repo-item:hover, .branch-item:hover:not(.disabled), .history-item:hover { border-color: var(--accent); }
  .branch-item.disabled { opacity: 0.45; cursor: default; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .tag-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .tag-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .tag-fail { background: color-mix(in srgb, var(--fail) 18%, transparent); color: var(--fail); }

  .history-item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .history-item-repo { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item-meta { font-size: 11px; color: var(--text-dim); }

  .back-link { background: none; border: none; color: var(--text-dim); font-size: 13px; padding: 0; cursor: pointer; margin-bottom: 12px; }

  .status-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot-queued { background: var(--text-dim); }
  .dot-running { background: var(--warn); animation: pulse 1.2s infinite ease-in-out; }
  .dot-ok { background: var(--ok); }
  .dot-fail { background: var(--fail); }
  .dot-skipped { background: var(--text-dim); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .muted { color: var(--text-dim); font-size: 13px; }
  .spin {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  a.apk-link { display: inline-block; margin-top: 10px; color: var(--accent); font-weight: 600; text-decoration: none; }
  a.apk-link:hover { text-decoration: underline; }

  .confirm-box {
    margin-top: 12px;
    border: 1px solid var(--warn);
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    border-radius: 8px;
    padding: 12px;
  }

  .step-list { margin-top: 14px; display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border); }
  .step-item { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .step-name { flex: 1; }
  .step-time { color: var(--text-dim); font-size: 11px; }

  .apk-pick { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .apk-pick button { text-align: left; }

  .section-title { font-size: 13px; font-weight: 600; margin: 20px 0 6px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Build Runner</h1>
  <p class="sub">Dispara builds do GitHub Actions direto do branch que já tem o workflow.</p>
  <div id="app"></div>
</div>

<script>
const API = "https://api.github.com";
const STORAGE_KEY = "build_runner_state_v1";
const HISTORY_KEY = "build_runner_history_v1";
const HISTORY_LIMIT = 50;

function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      token: state.token,
      user: state.user,
      screen: state.screen,
      selectedRepo: state.selectedRepo,
      selectedBranch: state.selectedBranch,
      run: state.run,
      artifact: state.artifact,
      jobSteps: state.jobSteps
    }));
  } catch (e) { /* storage full or blocked, ignore */ }
}

function persistHistory() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history.slice(0, HISTORY_LIMIT)));
  } catch (e) { /* ignore */ }
}

function clearPersisted() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

// Adds or updates a history entry keyed by run id. Called every time we
// learn a run's status, so the list always reflects the latest known state
// even if the run finished while the tab was closed.
function upsertHistory(entry) {
  const idx = state.history.findIndex(e => e.runId === entry.runId);
  if (idx === -1) {
    state.history.unshift(entry);
  } else {
    state.history[idx] = { ...state.history[idx], ...entry };
  }
  state.history = state.history.slice(0, HISTORY_LIMIT);
  persistHistory();
}

const persisted = loadPersisted();

let state = {
  token: persisted?.token || "",
  user: persisted?.user || null,
  screen: persisted?.token ? (persisted.screen || "repos") : "token",
  repos: [],
  reposLoading: false,
  repoFilter: "",
  selectedRepo: persisted?.selectedRepo || null,
  branches: [],
  branchesLoading: false,
  branchWorkflows: {},
  selectedBranch: persisted?.selectedBranch || null,
  run: persisted?.run || null,
  jobSteps: persisted?.jobSteps || [],
  artifact: persisted?.artifact || null,
  apkCandidates: null,
  pollTimer: null,
  pollRunId: null,
  errorMsg: "",
  confirmingDelete: false,
  extracting: false,
  history: loadHistory()
};

function h(tag, attrs, children) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "text") el.textContent = attrs[k];
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
    else if (k === "disabled") { if (attrs[k]) el.setAttribute("disabled", ""); }
    else el.setAttribute(k, attrs[k]);
  }
  if (children) children.forEach(c => c && el.appendChild(c));
  return el;
}

async function gh(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    cache: "no-store",
    headers: {
      "Authorization": "Bearer " + state.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      "Cache-Control": "no-cache",
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); if (j.message) msg = j.message; } catch(e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

function setError(msg) {
  state.errorMsg = msg || "";
  render();
}

async function connectToken() {
  const input = document.getElementById("token-input");
  const token = input.value.trim();
  if (!token) return;
  state.token = token;
  setError("");
  const btn = document.getElementById("connect-btn");
  btn.disabled = true;
  btn.textContent = "A ligar…";
  try {
    const me = await gh("/user");
    state.user = me;
    state.screen = "repos";
    persist();
    render();
    await fetchRepos();
  } catch (e) {
    setError("Não consegui autenticar: " + e.message + ". Confirma que o token tem o scope 'repo' e 'workflow'.");
  }
}

function logout() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  clearPersisted();
  const keepHistory = state.history;
  state = {
    token: "", user: null, screen: "token", repos: [], reposLoading: false, repoFilter: "",
    selectedRepo: null, branches: [], branchesLoading: false, branchWorkflows: {}, selectedBranch: null,
    run: null, jobSteps: [], artifact: null, apkCandidates: null, pollTimer: null, pollRunId: null,
    errorMsg: "", confirmingDelete: false, extracting: false, history: keepHistory
  };
  render();
}

async function fetchRepos() {
  if (state.reposLoading) return;
  state.reposLoading = true;
  setError("");
  try {
    let page = 1, all = [];
    while (true) {
      const batch = await gh(`/user/repos?per_page=100&page=${page}&sort=pushed`);
      all = all.concat(batch);
      if (batch.length < 100) break;
      page++;
      if (page > 10) break;
    }
    state.repos = all;
  } catch (e) {
    setError("Não consegui carregar repositórios: " + e.message);
  }
  state.reposLoading = false;
  render();
}

async function selectRepo(repo) {
  state.selectedRepo = repo;
  state.screen = "branches";
  state.branches = [];
  state.branchWorkflows = {};
  state.run = null;
  state.jobSteps = [];
  state.artifact = null;
  state.apkCandidates = null;
  persist();
  render();
  await fetchBranches(repo);
}

async function fetchBranches(repo) {
  if (state.branchesLoading) return;
  state.branchesLoading = true;
  setError("");
  try {
    let page = 1, all = [];
    while (true) {
      const batch = await gh(`/repos/${repo.full_name}/branches?per_page=100&page=${page}`);
      all = all.concat(batch);
      if (batch.length < 100) break;
      page++;
      if (page > 10) break;
    }
    state.branches = all;
    state.branchesLoading = false;
    render();
    for (const b of all) {
      checkBranchWorkflow(repo, b.name);
    }
    return;
  } catch (e) {
    setError("Não consegui carregar branches: " + e.message);
  }
  state.branchesLoading = false;
  render();
}

async function checkBranchWorkflow(repo, branchName) {
  try {
    const listing = await gh(`/repos/${repo.full_name}/contents/.github/workflows?ref=${encodeURIComponent(branchName)}`);
    const ymls = Array.isArray(listing) ? listing.filter(f => /\.ya?ml$/i.test(f.name)) : [];
    if (ymls.length === 0) {
      state.branchWorkflows[branchName] = { hasYml: false };
      render();
      return;
    }
    let found = null;
    for (const f of ymls) {
      try {
        const file = await gh(`/repos/${repo.full_name}/contents/${f.path}?ref=${encodeURIComponent(branchName)}`);
        const content = atob(file.content.replace(/\n/g, ""));
        if (/workflow_dispatch\s*:/.test(content)) {
          found = f;
          break;
        }
        if (!found) found = { path: f.path, noDispatch: true };
      } catch (e) { /* skip unreadable file */ }
    }
    if (found && !found.noDispatch) {
      state.branchWorkflows[branchName] = { hasYml: true, hasDispatch: true, path: found.path };
    } else {
      state.branchWorkflows[branchName] = { hasYml: true, hasDispatch: false, path: found ? found.path : ymls[0].path };
    }
  } catch (e) {
    state.branchWorkflows[branchName] = { hasYml: false };
  }
  render();
}

async function startBuild(branchName) {
  const repo = state.selectedRepo;
  const wf = state.branchWorkflows[branchName];
  if (!wf || !wf.hasDispatch) return;
  setError("");
  state.selectedBranch = branchName;
  state.screen = "build";
  state.run = { status: "queued", conclusion: null };
  state.jobSteps = [];
  state.artifact = null;
  state.apkCandidates = null;
  persist();
  render();
  try {
    const workflows = await gh(`/repos/${repo.full_name}/actions/workflows`);
    const match = workflows.workflows.find(w => w.path === wf.path);
    if (!match) throw new Error("Workflow não encontrado via API de Actions.");

    const beforeTime = new Date().toISOString();
    await gh(`/repos/${repo.full_name}/actions/workflows/${match.id}/dispatches`, {
      method: "POST",
      body: JSON.stringify({ ref: branchName })
    });

    await new Promise(r => setTimeout(r, 2500));
    let run = null;
    for (let i = 0; i < 10 && !run; i++) {
      const runs = await gh(`/repos/${repo.full_name}/actions/workflows/${match.id}/runs?branch=${encodeURIComponent(branchName)}&per_page=5`);
      run = runs.workflow_runs.find(r => r.created_at >= beforeTime) || runs.workflow_runs[0];
      if (!run) await new Promise(r => setTimeout(r, 2000));
    }
    if (!run) throw new Error("Build disparado mas não consegui localizar o run. Confere no GitHub.");

    state.run = run;
    persist();
    upsertHistory({
      runId: run.id,
      repoFullName: repo.full_name,
      branch: branchName,
      status: run.status,
      conclusion: run.conclusion,
      htmlUrl: run.html_url,
      createdAt: run.created_at
    });
    render();
    pollRun(repo.full_name, run.id);
  } catch (e) {
    setError("Falha ao disparar build: " + e.message);
    state.run = null;
    persist();
    render();
  }
}

async function loadJobSteps(fullName, runId) {
  try {
    const data = await gh(`/repos/${fullName}/actions/runs/${runId}/jobs`);
    const job = data.jobs && data.jobs[0];
    state.jobSteps = job ? (job.steps || []) : [];
  } catch (e) {
    // keep previous steps if this poll fails
  }
}

// Only one poll loop may run at a time. pollRunId identifies which run the
// active timer belongs to, so a stale timer can never overwrite a newer
// run's state even if it fires late.
function pollRun(fullName, runId) {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollRunId = runId;

  const tick = async () => {
    if (state.pollRunId !== runId) return; // a newer run took over; stop acting
    try {
      const run = await gh(`/repos/${fullName}/actions/runs/${runId}`);
      if (state.pollRunId !== runId) return;
      state.run = run;
      await loadJobSteps(fullName, runId);
      if (state.pollRunId !== runId) return;

      upsertHistory({
        runId: run.id,
        repoFullName: fullName,
        branch: state.selectedBranch,
        status: run.status,
        conclusion: run.conclusion,
        htmlUrl: run.html_url,
        createdAt: run.created_at
      });
      persist();

      if (run.status === "completed") {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
        if (run.conclusion === "success") {
          await loadArtifact(fullName, runId);
        }
      }
      render();
    } catch (e) {
      // transient network errors shouldn't kill the poll
    }
  };
  tick();
  state.pollTimer = setInterval(tick, 6000);
}

async function loadArtifact(fullName, runId) {
  try {
    const data = await gh(`/repos/${fullName}/actions/runs/${runId}/artifacts`);
    if (data.artifacts && data.artifacts.length > 0) {
      state.artifact = data.artifacts[0];
    }
  } catch (e) {
    setError("Build terminou mas não consegui buscar o artefacto: " + e.message);
  }
  persist();
  render();
}

// ---- minimal ZIP reader (store + deflate via DecompressionStream) ----
async function readZipEntries(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocdOffset = -1;
  for (let i = buf.length - 22; i >= 0 && i >= buf.length - 22 - 65557; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
  }
  if (eocdOffset === -1) throw new Error("ZIP inválido: EOCD não encontrado.");
  const entryCount = dv.getUint16(eocdOffset + 10, true);
  let cdOffset = dv.getUint32(eocdOffset + 16, true);

  const entries = [];
  for (let i = 0; i < entryCount; i++) {
    if (dv.getUint32(cdOffset, true) !== 0x02014b50) break;
    const method = dv.getUint16(cdOffset + 10, true);
    const compSize = dv.getUint32(cdOffset + 20, true);
    const uncompSize = dv.getUint32(cdOffset + 24, true);
    const nameLen = dv.getUint16(cdOffset + 28, true);
    const extraLen = dv.getUint16(cdOffset + 30, true);
    const commentLen = dv.getUint16(cdOffset + 32, true);
    const localHeaderOffset = dv.getUint32(cdOffset + 42, true);
    const nameBytes = buf.slice(cdOffset + 46, cdOffset + 46 + nameLen);
    const name = new TextDecoder().decode(nameBytes);
    entries.push({ name, method, compSize, uncompSize, localHeaderOffset });
    cdOffset += 46 + nameLen + extraLen + commentLen;
  }

  async function extract(entry) {
    const lh = entry.localHeaderOffset;
    if (dv.getUint32(lh, true) !== 0x04034b50) throw new Error("ZIP inválido: local header não encontrado.");
    const nameLen = dv.getUint16(lh + 26, true);
    const extraLen = dv.getUint16(lh + 28, true);
    const dataStart = lh + 30 + nameLen + extraLen;
    const compData = buf.slice(dataStart, dataStart + entry.compSize);
    if (entry.method === 0) return compData;
    if (entry.method === 8) {
      const ds = new DecompressionStream("deflate-raw");
      const stream = new Blob([compData]).stream().pipeThrough(ds);
      const outBuf = await new Response(stream).arrayBuffer();
      return new Uint8Array(outBuf);
    }
    throw new Error("Método de compressão ZIP não suportado: " + entry.method);
  }

  return { entries, extract };
}

function pickBestApk(names) {
  const priority = ["arm64-v8a", "armeabi-v7a", "x86_64", "universal"];
  for (const p of priority) {
    const match = names.find(n => n.toLowerCase().includes(p));
    if (match) return match;
  }
  return names[0] || null;
}

async function downloadArtifact() {
  const url = state.artifact ? state.artifact.archive_download_url : null;
  if (!url) return;
  const btn = document.getElementById("download-btn");
  if (btn) { btn.disabled = true; btn.textContent = "A transferir…"; }
  state.errorMsg = "";
  try {
    const res = await fetch(url, {
      cache: "no-store",
      headers: {
        "Authorization": "Bearer " + state.token,
        "Accept": "application/vnd.github+json"
      }
    });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const zipBlob = await res.blob();

    state.extracting = true;
    render();

    const { entries, extract } = await readZipEntries(zipBlob);
    const apkEntries = entries.filter(e => /\.apk$/i.test(e.name));

    if (apkEntries.length === 0) {
      throw new Error("Nenhum .apk encontrado dentro do artefacto.");
    }

    if (apkEntries.length === 1) {
      await extractAndSave(extract, apkEntries[0]);
      state.extracting = false;
      state.confirmingDelete = true;
    } else {
      const names = apkEntries.map(e => e.name);
      const bestName = pickBestApk(names);
      state.apkCandidates = { entries: apkEntries, extract, suggested: bestName };
      state.extracting = false;
    }
  } catch (e) {
    setError("Falha ao transferir/extrair: " + e.message);
    state.extracting = false;
  }
  render();
}

async function extractAndSave(extract, entry) {
  const data = await extract(entry);
  const apkBlob = new Blob([data], { type: "application/vnd.android.package-archive" });
  const blobUrl = URL.createObjectURL(apkBlob);
  const filename = entry.name.split("/").pop();
  const a = document.createElement("a");
  a.href = blobUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
}

async function chooseApk(entry) {
  const cand = state.apkCandidates;
  if (!cand) return;
  state.extracting = true;
  render();
  try {
    await extractAndSave(cand.extract, entry);
    state.apkCandidates = null;
    state.confirmingDelete = true;
  } catch (e) {
    setError("Falha ao extrair APK: " + e.message);
  }
  state.extracting = false;
  render();
}

async function confirmDeleteBuild() {
  const repo = state.selectedRepo;
  try {
    if (state.artifact) {
      await gh(`/repos/${repo.full_name}/actions/artifacts/${state.artifact.id}`, { method: "DELETE" });
    }
    if (state.run) {
      await gh(`/repos/${repo.full_name}/actions/runs/${state.run.id}`, { method: "DELETE" });
      state.history = state.history.filter(e => e.runId !== state.run.id);
      persistHistory();
    }
    state.run = null;
    state.jobSteps = [];
    state.artifact = null;
    state.apkCandidates = null;
    state.confirmingDelete = false;
    state.screen = "branches";
  } catch (e) {
    setError("Falha ao apagar: " + e.message);
  }
  persist();
  render();
}

function goBack() {
  setError("");
  if (state.screen === "branches") {
    state.screen = "repos";
    persist();
  } else if (state.screen === "build") {
    if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
    state.pollRunId = null;
    state.screen = "branches";
    state.run = null;
    state.jobSteps = [];
    state.artifact = null;
    state.apkCandidates = null;
    state.confirmingDelete = false;
    persist();
  } else if (state.screen === "history") {
    state.screen = "repos";
  }
  render();
}

function statusLabel(run) {
  if (!run) return { text: "A preparar…", dot: "queued" };
  if (run.status !== "completed") {
    return { text: run.status === "queued" ? "Na fila" : "A correr…", dot: run.status === "queued" ? "queued" : "running" };
  }
  if (run.conclusion === "success") return { text: "Sucesso", dot: "ok" };
  if (run.conclusion === "failure") return { text: "Falhou", dot: "fail" };
  if (run.conclusion === "cancelled") return { text: "Cancelado", dot: "fail" };
  return { text: run.conclusion || "Terminado", dot: "ok" };
}

function historyTag(entry) {
  if (entry.status !== "completed") return h("span", { class: "tag tag-warn", text: entry.status === "queued" ? "na fila" : "a correr" });
  if (entry.conclusion === "success") return h("span", { class: "tag tag-ok", text: "sucesso" });
  if (entry.conclusion === "failure") return h("span", { class: "tag tag-fail", text: "falhou" });
  if (entry.conclusion === "cancelled") return h("span", { class: "tag tag-fail", text: "cancelado" });
  return h("span", { class: "tag tag-warn", text: entry.conclusion || "terminado" });
}

function formatWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString();
}

function stepDot(step) {
  if (step.status !== "completed") return step.status === "in_progress" ? "running" : "queued";
  if (step.conclusion === "success") return "ok";
  if (step.conclusion === "skipped") return "skipped";
  return "fail";
}

function stepDuration(step) {
  if (!step.started_at) return "";
  const end = step.completed_at ? new Date(step.completed_at) : new Date();
  const start = new Date(step.started_at);
  const secs = Math.max(0, Math.round((end - start) / 1000));
  return secs + "s";
}

// render() only ever reads state and draws DOM. It never fetches and
// never calls itself.
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (state.screen === "token") {
    app.appendChild(h("div", { class: "card" }, [
      h("label", { for: "token-input", text: "Token de acesso pessoal do GitHub" }),
      h("input", { type: "password", id: "token-input", placeholder: "ghp_••••••••••••••••", onkeydown: e => { if (e.key === "Enter") connectToken(); } }),
      h("p", { class: "hint", text: "Precisa dos scopes 'repo' e 'workflow'. Fica guardado neste navegador (localStorage) até saíres." }),
      h("div", { class: "btn-row" }, [
        h("button", { class: "btn-primary", id: "connect-btn", text: "Ligar", onclick: connectToken })
      ]),
      state.errorMsg ? h("div", { class: "error-box", text: state.errorMsg }) : null
    ]));
    return;
  }

  if (state.screen === "repos") {
    const filtered = state.repos.filter(r => r.full_name.toLowerCase().includes(state.repoFilter.toLowerCase()));
    app.appendChild(h("div", { class: "btn-row spread" }, [
      h("label", { text: state.user ? ("Ligado como " + state.user.login) : "Repositórios" }),
      h("div", { class: "btn-row", style: "margin-top:0;" }, [
        h("button", { class: "btn-ghost", text: "Histórico", onclick: () => { state.screen = "history"; render(); } }),
        h("button", { class: "btn-ghost", text: "Sair", onclick: logout })
      ])
    ]));
    app.appendChild(h("div", { class: "card" }, [
      h("input", { type: "text", placeholder: "Filtrar repositórios…", value: state.repoFilter, oninput: e => { state.repoFilter = e.target.value; render(); } }),
      state.reposLoading
        ? h("p", { class: "muted", text: "A carregar repositórios…" })
        : h("div", { class: "repo-list" }, filtered.map(r =>
            h("button", { class: "repo-item", onclick: () => selectRepo(r) }, [
              h("span", { text: r.full_name }),
              r.private ? h("span", { class: "tag tag-warn", text: "privado" }) : null
            ])
          )),
      state.errorMsg ? h("div", { class: "error-box", text: state.errorMsg }) : null
    ]));
    return;
  }

  if (state.screen === "history") {
    app.appendChild(h("button", { class: "back-link", text: "← repositórios", onclick: goBack }));
    app.appendChild(h("div", { class: "card" }, [
      h("label", { text: "Histórico de builds" }),
      state.history.length === 0
        ? h("p", { class: "muted", text: "Ainda não há builds registados neste navegador." })
        : h("div", { class: "history-list" }, state.history.map(entry =>
            h("a", { class: "history-item", href: entry.htmlUrl || "#", target: "_blank" }, [
              h("div", { class: "history-item-main" }, [
                h("span", { class: "history-item-repo", text: entry.repoFullName + " @ " + entry.branch }),
                h("span", { class: "history-item-meta", text: formatWhen(entry.createdAt) })
              ]),
              historyTag(entry)
            ])
          ))
    ]));
    return;
  }

  if (state.screen === "branches") {
    app.appendChild(h("button", { class: "back-link", text: "← repositórios", onclick: goBack }));
    app.appendChild(h("div", { class: "card" }, [
      h("label", { text: state.selectedRepo.full_name }),
      state.branchesLoading
        ? h("p", { class: "muted", text: "A carregar branches…" })
        : h("div", { class: "branch-list" }, state.branches.map(b => {
            const wf = state.branchWorkflows[b.name];
            let tag = h("span", { class: "spin" });
            let disabled = true;
            if (wf) {
              if (wf.hasYml && wf.hasDispatch) {
                tag = h("span", { class: "tag tag-ok", text: "buildável" });
                disabled = false;
              } else if (wf.hasYml && !wf.hasDispatch) {
                tag = h("span", { class: "tag tag-warn", text: "sem workflow_dispatch" });
              } else {
                tag = h("span", { class: "tag tag-warn", text: "sem workflow" });
              }
            }
            return h("button", {
              class: "branch-item" + (disabled ? " disabled" : ""),
              onclick: disabled ? null : () => startBuild(b.name)
            }, [
              h("span", { text: b.name }),
              tag
            ]);
          })),
      state.errorMsg ? h("div", { class: "error-box", text: state.errorMsg }) : null
    ]));
    return;
  }

  if (state.screen === "build") {
    const st = statusLabel(state.run);
    app.appendChild(h("button", { class: "back-link", text: "← branches", onclick: goBack }));
    const card = h("div", { class: "card" }, [
      h("label", { text: state.selectedRepo.full_name + " @ " + state.selectedBranch }),
      h("div", { class: "status-row" }, [
        h("span", { class: "dot dot-" + st.dot }),
        h("span", { text: st.text })
      ])
    ]);

    if (state.run && state.run.html_url) {
      card.appendChild(h("a", { class: "apk-link", href: state.run.html_url, target: "_blank", text: "Ver no GitHub Actions ↗" }));
    }

    if (state.jobSteps && state.jobSteps.length > 0) {
      card.appendChild(h("div", { class: "step-list" }, state.jobSteps.map(step =>
        h("div", { class: "step-item" }, [
          h("span", { class: "dot dot-" + stepDot(step) }),
          h("span", { class: "step-name", text: step.name }),
          h("span", { class: "step-time", text: stepDuration(step) })
        ])
      )));
    }

    if (state.extracting) {
      card.appendChild(h("div", { class: "btn-row" }, [
        h("span", { class: "spin" }),
        h("span", { class: "muted", text: "A extrair o APK do artefacto…" })
      ]));
    }

    if (state.apkCandidates) {
      card.appendChild(h("p", { class: "hint", text: "Mais do que um APK encontrado. Escolhe o que combina com o teu telemóvel (arm64-v8a cobre praticamente todos os Android modernos):" }));
      card.appendChild(h("div", { class: "apk-pick" }, state.apkCandidates.entries.map(entry =>
        h("button", { class: "btn-ghost", onclick: () => chooseApk(entry) }, [
          h("span", { text: entry.name.split("/").pop() + (entry.name === state.apkCandidates.suggested ? "  (recomendado)" : "") })
        ])
      )));
    }

    if (state.run && state.run.status === "completed" && state.run.conclusion === "success" && !state.apkCandidates) {
      if (state.artifact) {
        card.appendChild(h("div", { class: "btn-row" }, [
          h("button", { class: "btn-primary", id: "download-btn", text: "Descarregar APK", onclick: downloadArtifact, disabled: state.extracting })
        ]));
      } else {
        card.appendChild(h("p", { class: "muted", text: "Sem artefactos encontrados neste run." }));
      }
    }

    if (state.run && state.run.status === "completed" && (state.run.conclusion === "failure" || state.run.conclusion === "cancelled")) {
      card.appendChild(h("p", { class: "muted", text: state.run.conclusion === "cancelled" ? "O build foi cancelado. Vê os detalhes no link acima." : "O build falhou. Vê os logs no link acima — o step que falhou aparece marcado a vermelho na lista." }));
      card.appendChild(h("div", { class: "btn-row" }, [
        h("button", { class: "btn-danger", text: "Apagar build", onclick: () => { state.confirmingDelete = true; render(); } })
      ]));
    }

    if (state.confirmingDelete) {
      card.appendChild(h("div", { class: "confirm-box" }, [
        h("p", { text: "Apagar este build (run + artefacto) do GitHub? Não é reversível." }),
        h("div", { class: "btn-row" }, [
          h("button", { class: "btn-danger", text: "Confirmar apagar", onclick: confirmDeleteBuild }),
          h("button", { class: "btn-ghost", text: "Cancelar", onclick: () => { state.confirmingDelete = false; render(); } })
        ])
      ]));
    }

    if (state.errorMsg) card.appendChild(h("div", { class: "error-box", text: state.errorMsg }));
    app.appendChild(card);
    return;
  }
}

async function resumeIfNeeded() {
  render();

  if (!state.token) return;

  if (state.screen === "repos" && state.repos.length === 0) {
    await fetchRepos();
  }

  if (state.screen === "branches" && state.selectedRepo && state.branches.length === 0) {
    await fetchBranches(state.selectedRepo);
  }

  if (state.screen === "build" && state.selectedRepo && state.run && state.run.id) {
    if (state.run.status !== "completed") {
      pollRun(state.selectedRepo.full_name, state.run.id);
    } else {
      await loadJobSteps(state.selectedRepo.full_name, state.run.id);
      persist();
      render();
    }
  }
}

resumeIfNeeded();
</script>
</body>
</html>
